name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Win32, WPF y WinForms sólo compilan en Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore FocusWShell.slnx

      # Los avisos son errores (Directory.Build.props), así que esto también comprueba el análisis estático.
      - name: Compilar
        run: dotnet build FocusWShell.slnx --no-restore --configuration Release

      # Sólo pruebas de Core: no mueven ventanas ni necesitan escritorio.
      - name: Probar
        run: dotnet test FocusWShell.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
